[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unslop"
dynamic = ["version"]
description = "Catch AI-hallucinated (slopsquatted) package names before they get installed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Raj" }]
keywords = ["security", "supply-chain", "slopsquatting", "typosquatting", "pypi", "npm", "devsecops", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests>=2.28",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/gaurav-11-cyber/Unslop"
Issues = "https://github.com/gaurav-11-cyber/Unslop/issues"
Changelog = "https://github.com/gaurav-11-cyber/Unslop/blob/main/CHANGELOG.md"

[project.scripts]
unslop = "unslop.cli:main"

[tool.setuptools]
packages = ["unslop"]

[tool.setuptools.dynamic]
version = { attr = "unslop.__version__" }

[tool.setuptools.package-data]
unslop = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
