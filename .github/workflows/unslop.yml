name: Unslop

# Scans dependencies ADDED in a pull request for AI-hallucinated (slopsquatted) names.
# Uses `pull_request` (not `pull_request_target`) so code from forks never runs with secrets.

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "package.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pyproject.toml"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.sh"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/Dockerfile*"
      - "**/.cursorrules"

permissions:
  contents: read
  pull-requests: write
  security-events: write   # upload SARIF (code scanning needs a public repo or GitHub Advanced Security)

concurrency:
  group: unslop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Unslop needs the base branch to see what is new
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Unslop
        run: pip install .

      - name: Scan newly added dependencies
        id: scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          mapfile -d '' -t FILES < <(git diff -z --name-only --diff-filter=AM \
            "origin/${BASE_REF}...HEAD" -- '*requirements*.txt' '*package.json' '*package-lock.json' '*pyproject.toml' '*.md' '*.mdx' '*.sh' '*.yml' '*.yaml' '*Dockerfile*' '*.cursorrules' ':(exclude)*node_modules/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No dependency manifests, docs or scripts changed."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unslop scan "${FILES[@]}" --base "origin/${BASE_REF}" \
            --markdown unslop-comment.md --json unslop-report.json --sarif unslop.sarif
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          [ -f unslop-comment.md ] && cat unslop-comment.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('unslop.sarif') != '' && github.event.repository.private == false
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: unslop.sarif
          category: unslop

      - name: Post or update PR comment
        if: always() && hashFiles('unslop-comment.md') != ''
        continue-on-error: true   # read-only token on fork PRs: the job summary still has the report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('unslop-comment.md', 'utf8');
            const marker = '<!-- unslop-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce gate
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::Unslop found a blocked package, or could not run (exit code ${{ steps.scan.outputs.exit_code }}). See the PR comment or job summary."
          exit 1
