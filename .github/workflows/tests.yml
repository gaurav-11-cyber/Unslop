name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean venv and scan a documented incident
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$(mktemp -d)"
          echo '{"dependencies":{"react-codeshift":"1.0.0"}}' > package.json
          "$RUNNER_TEMP/venv/bin/unslop" --help > /dev/null
          set +e
          "$RUNNER_TEMP/venv/bin/unslop" scan package.json --no-cache
          code=$?
          [ "$code" -eq 1 ] || { echo "expected exit code 1 (documented incident blocked), got $code"; exit 1; }
